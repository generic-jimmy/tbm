services:
  - type: web
    name: tbm-pro
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: AUTO_FORWARD_FILES
        value: "true"
      - key: HISTORY_DRAIN_ON_BOOT
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
